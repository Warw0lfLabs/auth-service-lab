name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authlab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: authlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authlab -d authlab_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://authlab:ci-only-password@localhost:5432/authlab_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+psycopg://authlab:ci-only-password@localhost:5432/authlab_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src migrations scripts
      - run: alembic upgrade head && alembic check
      - run: pytest --cov=auth_service --cov-report=term-missing
      - run: docker build -t auth-service-lab:ci .
