services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: authlab
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authlab -d authlab"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://authlab:${POSTGRES_PASSWORD}@db:5432/authlab
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://authlab:${POSTGRES_PASSWORD}@db:5432/authlab
      REDIS_URL: redis://redis:6379/0
      MAIL_DIR: /app/.dev-mail
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["mail:/app/.dev-mail"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  mail:
