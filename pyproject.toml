[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "Flask>=3.1,<4", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
 "alembic>=1.16,<2", "argon2-cffi>=25,<26", "PyJWT>=2.10,<3",
 "pydantic[email]>=2.11,<3", "Flask-Limiter[redis]>=4,<5",
 "httpx>=0.28,<1", "gunicorn>=23,<24", "redis>=6,<8"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.16,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = ["flask_limiter.*", "argon2.*"]
ignore_missing_imports = true
